name: Build all platforms

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows bundle
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows bundles
        run: npm run tauri build -- --bundles nsis,msi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: collectrix-windows
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  android:
    name: Android debug APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK and NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          TOOLS_DIR="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 1 -mindepth 1 -type d | sort | tail -n 1)/bin"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          export PATH="$TOOLS_DIR:$SDK_ROOT/platform-tools:$PATH"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$TOOLS_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Android debug APK
        run: npm run tauri android build -- --debug --target aarch64 --apk --ci

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: collectrix-android-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  linux:
    name: Linux bundle
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libfuse2 \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Linux bundles
        run: npm run tauri build -- --bundles deb,appimage

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: collectrix-linux
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  macos-x64:
    name: macOS x86_64 bundle
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.15"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS bundles
        run: npm run tauri build -- --bundles app,dmg

      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: collectrix-macos-x64
          path: src-tauri/target/release/bundle/**
          if-no-files-found: error

  macos-arm64:
    name: macOS arm64 bundle
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build macOS bundles
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles app,dmg

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: collectrix-macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/**
          if-no-files-found: error
