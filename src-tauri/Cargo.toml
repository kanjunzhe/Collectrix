[package]
name = "collectrix"
version = "0.1.0"
description = "Collectrix - local video library and knowledge manager"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "collectrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "gzip", "brotli", "deflate", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
md5 = "0.7"
sha2 = "0.10"
url = "2"
once_cell = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
quick-xml = "0.31"
encoding_rs = "0.8"
flate2 = "1"
async-trait = "0.1"
scraper = "0.29.0"

# Desktop-only native media/JS dependencies.
[target.'cfg(not(target_os = "android"))'.dependencies]
innertube-rs = "0.9"
whisper-rs = "0.16"
symphonia = { version = "0.5", features = ["mp3", "aac", "isomp4", "flac", "wav"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
