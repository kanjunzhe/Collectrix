<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Collectrix">
  <title>Collectrix — 扁平版（≤48px 使用）</title>
  <defs>
    <mask id="playCut">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M 184 246 L 262 290 L 184 334 Z" fill="#000" stroke="#000" stroke-width="16" stroke-linejoin="round"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="112" fill="#1976D2"/>

  <!-- 堆叠 -->
  <g>
    <rect x="140" y="78" width="300" height="306" rx="64" fill="#A9B9CF"/>
    <rect x="140" y="72" width="300" height="300" rx="64" fill="#FFFFFF"/>

    <rect x="106" y="112" width="300" height="306" rx="64" fill="#A9B9CF"/>
    <rect x="106" y="106" width="300" height="300" rx="64" fill="#FFFFFF"/>

    <rect x="72" y="146" width="300" height="306" rx="64" fill="#A9B9CF"/>
    <rect x="72" y="140" width="300" height="300" rx="64" fill="#FFFFFF"/>
  </g>

  <!-- 点阵 -->
  <g fill="#0E3358" fill-opacity="0.16">
    <circle cx="300" cy="270" r="5"/><circle cx="320" cy="270" r="5"/><circle cx="340" cy="270" r="5"/>
    <circle cx="300" cy="290" r="5"/><circle cx="320" cy="290" r="5"/><circle cx="340" cy="290" r="5"/>
    <circle cx="300" cy="310" r="5"/><circle cx="320" cy="310" r="5"/><circle cx="340" cy="310" r="5"/>
  </g>

  <!-- 播放键（负空间切出） -->
  <rect x="72" y="140" width="300" height="300" rx="64" fill="#1565C0" mask="url(#playCut)"/>
</svg>
